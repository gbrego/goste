# GoSTE Benchmark Configuration - QUICK TEST MODE
# ─────────────────────────────────────────────────────────────────────────────
# All paths are resolved relative to the benchmark/ directory unless absolute.
# Run the harness as root (required for GoSTE / eBPF):
#   sudo python3 harness.py -c config_quick.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Path to the compiled GoSTE binary
goste_binary: "../goste"

# ── Global timing parameters ─────────────────────────────────────────────────
runs: 1             # repetitions per mode (baseline / tracing / enforcement)
warmup_secs: 1      # seconds to let the target warm up before measuring
duration_secs: 15    # measurement window (continuous) or safety timeout (oneshot load generators)
cooldown_secs: 3    # pause between consecutive runs (let system settle)

# ── Target definitions ────────────────────────────────────────────────────────
targets:

  # ── etcd (Light/Baseline) ──────────────────────────────────────────────────
  etcd_light:
    enabled: true
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: ["--data-dir=default.etcd"]
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).run"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=5"
        - "--conns=5"
        - "put"
        - "--key-size=8"
        - "--val-size=256"
        - "--total=1000"

  # ── etcd (Intensive Overhead Stress) ───────────────────────────────────────
  etcd_intensive:
    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: 
      - "--data-dir=/dev/shm/etcd_bench.data"
      - "--quota-backend-bytes=8589934592"
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Put"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Range"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).DeleteRange"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Txn"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Compact"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*LeaseServer).LeaseGrant"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*LeaseServer).LeaseRevoke"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*AuthServer).Authenticate"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*maintenanceServer).Defragment"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*maintenanceServer).Snapshot"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*watchableStore).notify"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*treeIndex).Put"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*treeIndex).Get"
      - "go.etcd.io/etcd/server/v3/storage/wal.(*filePipeline).run"
      - "go.etcd.io/bbolt.(*Tx).Commit"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=10"
        - "--conns=10"
        - "put"
        - "--key-size=8"
        - "--val-size=128"
        - "--total=20000"

