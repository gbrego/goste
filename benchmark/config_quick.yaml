    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: 
      - "--data-dir=/dev/shm/etcd_data.data"
      - "--quota-backend-bytes=8589934592"
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).run"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
