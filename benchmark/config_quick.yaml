    load_generator:
      type: oneshot
      binary: "dnsperf"
      args:
        - "-s"
        - "127.0.0.1"
        - "-p"
        - "1053"
        - "-d"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/coredns_1.14.3_linux_amd64/queries.txt"
        - "-c"
        - "5"
        - "-n"
        - "20000"
