# GoSTE Benchmark Configuration
# ─────────────────────────────────────────────────────────────────────────────
# All paths are resolved relative to the benchmark/ directory unless absolute.
# Run the harness as root (required for GoSTE / eBPF):
#   sudo python3 harness.py
# ─────────────────────────────────────────────────────────────────────────────

# Path to the compiled GoSTE binary
goste_binary: "../goste"

# ── Global timing parameters ─────────────────────────────────────────────────
runs: 2             # repetitions per mode (baseline / tracing / enforcement)
warmup_secs: 2      # seconds to let the target warm up before measuring
duration_secs: 120  # measurement window (continuous) or safety timeout (oneshot load generators)
cooldown_secs: 2    # pause between consecutive runs (let system settle)

# ── Target definitions ────────────────────────────────────────────────────────
# Each target can specify:
#   binary        – path to the target executable
#   args          – list of extra arguments to pass to the binary
#   policy        – (optional) path to a pre-generated policy JSON.
#                   If omitted, the policy is auto-generated from the tracing
#                   runs and saved to results/<target>_policy.json.
#   state_symbols – symbols to use as state-transition triggers in GoSTE.
#                   Format: "pkg/path.Function" (same as -s flag).
#                   Leave empty [] for stateless tracing.
#   load_generator – (optional) tool to stress the target during measurement.
#                   binary + args are launched as a separate subprocess.
#   enabled       – set to false to skip this target entirely.

targets:

  # ── etcd (Light/Baseline) ──────────────────────────────────────────────────
  # Original test: 100k puts, 10 clients. Good for a quick baseline.
  etcd_light:
    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: ["--data-dir=default.etcd"]
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).run"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=10"
        - "--conns=10"
        - "put"
        - "--key-size=8"
        - "--val-size=256"
        - "--total=100000"

  # ── etcd (Intensive Overhead Stress) ───────────────────────────────────────
  # Stresses the syscall interposer and goroutine tracking.
  # Uses /dev/shm (RAM disk) to eliminate I/O wait and maximize CPU/BPF load.
  etcd_intensive:
    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: 
      - "--data-dir=/dev/shm/etcd_bench.data"
      - "--quota-backend-bytes=8589934592"
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Put"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Range"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).DeleteRange"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Txn"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*kvServer).Compact"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*LeaseServer).LeaseGrant"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*LeaseServer).LeaseRevoke"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*AuthServer).Authenticate"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*maintenanceServer).Defragment"
      - "go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc.(*maintenanceServer).Snapshot"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*watchableStore).notify"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*treeIndex).Put"
      - "go.etcd.io/etcd/server/v3/storage/mvcc.(*treeIndex).Get"
      - "go.etcd.io/etcd/server/v3/storage/wal.(*filePipeline).run"
      - "go.etcd.io/bbolt.(*Tx).Commit"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=200"   # High concurrency to stress syscall interposer
        - "--conns=100"
        - "put"
        - "--key-size=8"
        - "--val-size=128"   # Smaller size = more requests/sec = more syscalls/sec
        - "--total=500000"

  # ── etcd (Data Heavy - Serialization Stress) ──────────────────────────────
  # Stresses GoSTE during large data handling. Large Protobuf buffers increase
  # CPU time per goroutine, while large write() syscalls test tracing latency 
  # on data-heavy I/O operations.
  etcd_data_heavy:
    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: ["--data-dir=/dev/shm/etcd_data.data"]
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).run"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=20"
        - "--conns=10"
        - "put"
        - "--key-size=8"
        - "--val-size=1048576" # 1MB values
        - "--total=5000"

  # ── etcd (Logic Heavy - Transactional Stress) ─────────────────────────────
  # Stresses GoSTE's state tracking over complex execution paths. Uses 
  # STM (Software Transactional Memory) to trigger deep internal etcd logic
  # and multiple state-dependent syscalls per operation.
  etcd_logic_heavy:
    enabled: false
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/etcd"
    args: ["--data-dir=/dev/shm/etcd_logic.data"]
    state_symbols:
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).run"
      - "go.etcd.io/etcd/server/v3/etcdserver.(*EtcdServer).Process"
    load_generator:
      type: oneshot
      binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/etcd-v3.6.10-linux-amd64/benchmark-etcd"
      args:
        - "--endpoints=http://localhost:2379"
        - "--clients=50"
        - "--conns=10"
        - "stm"
        - "--total=20000"
        - "--keys=1000"
        - "--keys-per-txn=5"
        - "--isolation=s"

  # ── CoreDNS (Intensive Tracing) ───────────────────────────────────────────
  coredns_intensive:
    enabled: true
    binary: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/coredns_1.14.3_linux_amd64/coredns"
    args: 
      - "-conf"
      - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/coredns_1.14.3_linux_amd64/Corefile"
    port: 1053
    state_symbols:
      - "github.com/coredns/coredns/core/dnsserver.(*Server).ServePacket"
      - "github.com/coredns/coredns/core/dnsserver.(*Server).ServeDNS"
      - "github.com/coredns/coredns/core/dnsserver.errorFunc"
      - "github.com/coredns/coredns/request.(*Request).NewWithQuestion"
      - "github.com/coredns/coredns/plugin.NextOrFailure"
      - "github.com/coredns/coredns/plugin.(*pluginWriter).WriteMsg"
      - "github.com/coredns/coredns/plugin/errors.(*errorHandler).ServeDNS"
      - "github.com/coredns/coredns/plugin/log.Logger.ServeDNS"
      - "github.com/coredns/coredns/plugin/metrics.(*Metrics).ServeDNS"
      - "github.com/coredns/coredns/plugin/cache.(*Cache).ServeDNS"
      - "github.com/coredns/coredns/plugin/rewrite.Rewrite.ServeDNS"
      - "github.com/coredns/coredns/plugin/kubernetes.Kubernetes.ServeDNS"
      - "github.com/coredns/coredns/plugin/forward.(*Forward).ServeDNS"
      - "github.com/coredns/coredns/plugin/file.File.ServeDNS"
      - "github.com/coredns/coredns/plugin/hosts.Hosts.ServeDNS"
      - "github.com/coredns/coredns/plugin/loadbalance.LoadBalance.ServeDNS"
      - "github.com/coredns/coredns/plugin/whoami.Whoami.ServeDNS"
    load_generator:
      type: oneshot
      binary: "dnsperf"
      args:
        - "-s"
        - "127.0.0.1"
        - "-p"
        - "1053"
        - "-d"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/coredns_1.14.3_linux_amd64/queries.txt"
        - "-c"
        - "100"
        - "-n"
        - "50000"

  # ── geth (Intensive RPC Stress) ────────────────────────────────────────────
  # Stresses the JSON-RPC layer, EVM execution, and state trie operations.
  # Uses --dev mode for a private single-node chain with instant mining.
  # The IPC socket /tmp/geth.ipc is cleaned up automatically before each run.
  geth_intensive:
    enabled: false
    binary: "/home/brego/go/bin/geth"
    args:
      - "--dev"
      - "--http"
      - "--http.addr=127.0.0.1"
      - "--http.port=8545"
      - "--verbosity=0"
    state_symbols:
      - "github.com/ethereum/go-ethereum/rpc.(*Server).ServeHTTP"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleMsg"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.DoCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.doCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.applyMessage"
      - "github.com/ethereum/go-ethereum/core.ApplyTransaction"
      - "github.com/ethereum/go-ethereum/core.ApplyMessage"
      - "github.com/ethereum/go-ethereum/core/vm.(*EVM).Call"
      - "github.com/ethereum/go-ethereum/core/state.(*StateDB).GetState"
      - "github.com/ethereum/go-ethereum/core/state.(*StateDB).SetState"
      - "github.com/ethereum/go-ethereum/trie.(*Trie).Get"
      - "github.com/ethereum/go-ethereum/trie.(*Trie).Update"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*EthereumAPI).GasPrice"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*EthereumAPI).MaxPriorityFeePerGas"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*EthereumAPI).FeeHistory"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*EthereumAPI).BlobBaseFee"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*EthereumAPI).Syncing"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).ChainId"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).BlockNumber"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetBalance"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetProof"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetHeaderByNumber"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetHeaderByHash"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetBlockByNumber"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetBlockByHash"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetUncleByBlockNumberAndIndex"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetUncleByBlockHashAndIndex"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetUncleCountByBlockNumber"
      - "github.com/ethereum/go-ethereum/internal/ethapi.(*BlockChainAPI).GetUncleCountByBlockHash"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).validJumpdest"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).isCode"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).GetOp"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).Caller"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).UseGas"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).RefundGas"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).Address"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).Value"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).SetCallCode"
      - "github.com/ethereum/go-ethereum/core/vm.(*ecrecover).RequiredGas"
      - "github.com/ethereum/go-ethereum/core/vm.(*ecrecover).Run"
      - "github.com/ethereum/go-ethereum/core/vm.(*ecrecover).Name"
      - "github.com/ethereum/go-ethereum/core/vm.(*sha256hash).RequiredGas"
      - "github.com/ethereum/go-ethereum/core/vm.(*sha256hash).Run"
      - "github.com/ethereum/go-ethereum/core/vm.(*sha256hash).Name"
      - "github.com/ethereum/go-ethereum/crypto.Keccak256"
      - "github.com/ethereum/go-ethereum/core/rawdb.ReadBlock"
      - "github.com/ethereum/go-ethereum/core/txpool.(*TxPool).Add"
