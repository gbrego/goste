      type: oneshot
      binary: "hey"
      args:
        - "-m"
        - "POST"
        - "-T"
        - "application/json"
        - "-D"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/heavy_payload.json"
        - "-c"
        - "100"
        - "-n"
        - "10000"
        - "http://localhost:8545"

  # ── geth (EVM Computation Heavy) ───────────────────────────────────────────
  # Favourable workload for GoSTE: each request triggers deep EVM bytecode
  # execution (1000 KECCAK256 iterations via eth_call constructor simulation).
  # The goroutine spends much more time inside each state than with simple
  # read RPCs, so the uprobe/BPF overhead is amortised over more useful work.
  # Uses eth_call with to:null so no signing or nonce management is needed.
  geth_evm_heavy:
    enabled: false
    binary: "/home/brego/go/bin/geth"
    policy: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/geth-evm-heavy-policy.json"
    args:
      - "--dev"
      - "--http"
      - "--http.addr=127.0.0.1"
      - "--http.port=8545"
      - "--verbosity=0"
    state_symbols:
      - "github.com/ethereum/go-ethereum/rpc.(*Server).ServeHTTP"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleMsg"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.DoCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.doCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.applyMessage"
      - "github.com/ethereum/go-ethereum/core.ApplyMessage"
      - "github.com/ethereum/go-ethereum/core/vm.(*EVM).Call"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).validJumpdest"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).UseGas"
      - "github.com/ethereum/go-ethereum/core/vm.(*Contract).GetOp"
      - "github.com/ethereum/go-ethereum/crypto.Keccak256"
      - "github.com/ethereum/go-ethereum/core/state.(*StateDB).GetState"
      - "github.com/ethereum/go-ethereum/trie.(*Trie).Get"
    load_generator:
      type: oneshot
      binary: "hey"
      args:
        - "-m"
        - "POST"
        - "-T"
        - "application/json"
        - "-D"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/heavy_evm_payload.json"
        - "-c"
        - "50"
        - "-n"
        - "5000"
        - "http://localhost:8545"

  # ── geth (CGO and low-level syscalls) ──────────────────────────────────────
  # Traces CGO transitions and cryptographic primitives.
  geth_cgo:
    enabled: false
    binary: "/home/brego/go/bin/geth"
    policy: "/home/brego/geth-cgo-policy.json"
    args:
      - "--dev"
      - "--http"
      - "--http.addr=127.0.0.1"
      - "--http.port=8545"
      - "--verbosity=0"
    state_symbols:
      - "github.com/ethereum/go-ethereum/rpc.(*Server).ServeHTTP"
      - "secp256k1_ecdsa_recover"
      - "secp256k1_ecdsa_verify"
      - "x_cgo_sys_thread_create"
      - "x_cgo_mmap"
      - "crosscall2"
    load_generator:
      type: oneshot
      binary: "hey"
      args:
        - "-m"
        - "POST"
        - "-T"
        - "application/json"
        - "-D"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/cgo-payload.json"
        - "-c"
        - "50"
        - "-n"
        - "50000"
        - "http://localhost:8545"


  # ── geth (EVM Computation Heavy - Optimized) ───────────────────────────────
  # Macro-states only: demonstrates how overhead is amortized when tracing
  # is not firing on every opcode.
  geth_evm_refined:
    enabled: false
    binary: "/home/brego/go/bin/geth"
    policy: "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/geth-evm-refined-policy.json"
    args:
      - "--dev"
      - "--http"
      - "--http.addr=127.0.0.1"
      - "--http.port=8545"
      - "--verbosity=0"
    state_symbols:
      - "github.com/ethereum/go-ethereum/rpc.(*Server).ServeHTTP"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleMsg"
      - "github.com/ethereum/go-ethereum/rpc.(*handler).handleCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.DoCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.doCall"
      - "github.com/ethereum/go-ethereum/internal/ethapi.applyMessage"
      - "github.com/ethereum/go-ethereum/core.ApplyMessage"
      - "github.com/ethereum/go-ethereum/core/vm.(*EVM).Call"
      - "github.com/ethereum/go-ethereum/crypto.Keccak256"
      - "github.com/ethereum/go-ethereum/core/state.(*StateDB).GetState"
      - "github.com/ethereum/go-ethereum/trie.(*Trie).Get"
    load_generator:
      type: oneshot
      binary: "hey"
      args:
        - "-m"
        - "POST"
        - "-T"
        - "application/json"
        - "-D"
        - "/home/brego/Documents/Uni/Tesi/industryTargetsAlpha/geth-bench/heavy_evm_payload.json"
        - "-c"
        - "50"
        - "-n"
        - "5000"
        - "http://localhost:8545"